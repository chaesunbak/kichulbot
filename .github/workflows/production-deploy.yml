name: 프로덕션 빌드 및 배포

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-container-images:
    name: ${{ matrix.app }} 컨테이너 이미지
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            image: kichulbot-api
          - app: web
            dockerfile: apps/web/Dockerfile
            image: kichulbot-web
          - app: admin
            dockerfile: apps/admin/Dockerfile
            image: kichulbot-admin
          - app: extractor
            dockerfile: apps/extractor/Dockerfile
            image: kichulbot-extractor

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 컨테이너 이미지 메타데이터 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=sha,prefix=sha-,format=long

      - name: 컨테이너 이미지 빌드 및 게시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.app == 'web' && format('NEXT_PUBLIC_SITE_URL={0}', vars.NEXT_PUBLIC_SITE_URL) || '' }}
            ${{ matrix.app == 'web' && format('NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN={0}', vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN) || '' }}
            ${{ matrix.app == 'web' && format('NEXT_PUBLIC_POSTHOG_HOST={0}', vars.NEXT_PUBLIC_POSTHOG_HOST) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-to-oracle:
    name: 오라클 서버 배포
    runs-on: ubuntu-24.04
    needs: build-and-publish-container-images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 배포 파일 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || '22' }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile
          target: ${{ vars.ORACLE_DEPLOY_PATH || '/opt/kichulbot' }}
          strip_components: 1

      - name: 컨테이너 이미지 갱신 및 재시작
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.ORACLE_DEPLOY_PATH || '/opt/kichulbot' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
          IMAGE_TAG: ${{ vars.IMAGE_TAG || 'latest' }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_INTERNAL_BASE_URL: ${{ vars.API_INTERNAL_BASE_URL || 'http://api:4000/api' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'kichulbot' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'kichulbot' }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NICKNAME: ${{ vars.ADMIN_NICKNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '7d' }}
          KAKAO_CLIENT_ID: ${{ vars.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER || 'local' }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          PAPER_IMPORT_SERVICE_TOKEN: ${{ secrets.PAPER_IMPORT_SERVICE_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || '22' }}
          envs: DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN,GHCR_OWNER,IMAGE_TAG,WEB_DOMAIN,ADMIN_DOMAIN,API_DOMAIN,API_INTERNAL_BASE_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN,NEXT_PUBLIC_POSTHOG_HOST,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_NICKNAME,JWT_SECRET,JWT_EXPIRES_IN,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,RESEND_API_KEY,RESEND_FROM_EMAIL,STORAGE_DRIVER,R2_ENDPOINT,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,R2_PUBLIC_BASE_URL,PAPER_IMPORT_SERVICE_TOKEN
          script_stop: true
          script: |
            set -euo pipefail

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            umask 077
            python3 <<'PY'
            import os
            import sys

            required_envs = [
                "GHCR_OWNER",
                "WEB_DOMAIN",
                "ADMIN_DOMAIN",
                "API_DOMAIN",
                "NEXT_PUBLIC_SITE_URL",
                "POSTGRES_PASSWORD",
                "ADMIN_EMAIL",
                "ADMIN_PASSWORD",
                "ADMIN_NICKNAME",
                "JWT_SECRET",
                "PAPER_IMPORT_SERVICE_TOKEN",
            ]

            env_names = [
                "GHCR_OWNER",
                "IMAGE_TAG",
                "WEB_DOMAIN",
                "ADMIN_DOMAIN",
                "API_DOMAIN",
                "API_INTERNAL_BASE_URL",
                "NEXT_PUBLIC_SITE_URL",
                "NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN",
                "NEXT_PUBLIC_POSTHOG_HOST",
                "POSTGRES_USER",
                "POSTGRES_PASSWORD",
                "POSTGRES_DB",
                "ADMIN_EMAIL",
                "ADMIN_PASSWORD",
                "ADMIN_NICKNAME",
                "JWT_SECRET",
                "JWT_EXPIRES_IN",
                "KAKAO_CLIENT_ID",
                "KAKAO_CLIENT_SECRET",
                "RESEND_API_KEY",
                "RESEND_FROM_EMAIL",
                "STORAGE_DRIVER",
                "R2_ENDPOINT",
                "R2_ACCESS_KEY_ID",
                "R2_SECRET_ACCESS_KEY",
                "R2_BUCKET",
                "R2_PUBLIC_BASE_URL",
                "PAPER_IMPORT_SERVICE_TOKEN",
            ]

            missing_envs = [name for name in required_envs if not os.environ.get(name)]
            if missing_envs:
                for name in missing_envs:
                    print(f"프로덕션 환경변수가 비어 있습니다: {name}", file=sys.stderr)
                sys.exit(1)

            env_values = {}
            for name in env_names:
                value = os.environ.get(name, "")
                if "\n" in value or "\r" in value:
                    print(f"프로덕션 환경변수는 줄바꿈을 포함할 수 없습니다: {name}", file=sys.stderr)
                    sys.exit(1)
                env_values[name] = value

            tmp_path = ".env.tmp"
            with open(tmp_path, "w", encoding="utf-8") as env_file:
                for name, value in env_values.items():
                    escaped_value = value.replace("\\", "\\\\").replace("'", "\\'")
                    env_file.write(f"{name}='{escaped_value}'\n")

            os.chmod(tmp_path, 0o600)
            os.replace(tmp_path, ".env")
            PY
            chmod 600 .env

            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm api pnpm prisma:migrate:deploy
            docker compose -f docker-compose.prod.yml run --rm api pnpm seed:prod
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
