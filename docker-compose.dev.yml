services:
  postgres:
    image: postgres:16
    container_name: kichulbot-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: kichulbot
      POSTGRES_PASSWORD: kichulbot
      POSTGRES_DB: kichulbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kichulbot -d kichulbot']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kichulbot-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'

  extractor:
    build:
      context: .
      dockerfile: apps/extractor/Dockerfile
    container_name: kichulbot-extractor
    restart: unless-stopped
    profiles:
      - extractor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://kichulbot:kichulbot@postgres:5432/kichulbot?schema=public
      REDIS_URL: redis://redis:6379
      PAPER_IMPORT_STORAGE_DIR: /app/apps/api/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:4000/uploads
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads

volumes:
  postgres_data:
